<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <title></title>
</head>

<body class="container mt-4">
    <br />
    <form id="editForm" class="bg-white p-4 rounded shadow-sm">
        <label for="firstname">First name</label>
        <input type="text" name="firstname" id="firstname" class="form-control"><br />
        <label for="lastname">Last name</label>
        <input type="text" name="lastname" id="lastname" class="form-control"><br />
        <label for="mobile">Mobile</label>
        <input type="text" name="mobile" id="mobile" class="form-control"><br />
        <label for="email">Email</label>
        <input type="text" name="email" id="email" class="form-control"><br />
        <label for="avatar">Select a file</label><br />
        <input type="file" name="avatar" id="avatar" class="form-control-file"><br />
        <button type="submit" id="submitForm" class="btn btn-success">Submit</button>
    </form>
    <br />
    <button id="homeLink" type="button" class="btn btn-secondary">Home</button>

    <script src="config.js"></script>
    <script>
        document.getElementById("submitForm").addEventListener('click', submitForm);
        document.getElementById("homeLink").addEventListener('click', homeLink);

        function submitForm(e) {
            e.preventDefault();
            const form = new FormData(document.querySelector('#editForm'));
            form.append('apiKey', apiKey);
            fetch(rootPath + 'controller/insert-contact/', {
                method: 'POST',
                headers: { 'Accept': 'application/json, *.*' },
                body: form
            })
                .then(function (response) {
                    return response.text();
                })
                .then(function (data) {
                    if (data == "1") {
                        alert("Contact added.");
                        homeLink();
                    } else {
                        alert(data);
                        homeLink();
                    }
                })
        }

        function homeLink() {
            window.open("index.html", "_self");
        }
    </script>
</body>

</html
