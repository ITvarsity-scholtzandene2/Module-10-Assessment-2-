<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <title></title>
</head>

<body onload="getContact()" class="container mt-4">
    <div id="avatarImage" class="text-center mb-3"></div>
    <form id="editForm" class="bg-white p-4 rounded shadow-sm">
        <label for="firstname">First name</label>
        <input type="text" name="firstname" id="firstname" class="form-control" readonly><br />
        <label for="lastname">Last name</label>
        <input type="text" name="lastname" id="lastname" class="form-control" readonly><br />
        <label for="mobile">Mobile</label>
        <input type="text" name="mobile" id="mobile" class="form-control" readonly><br />
        <label for="email">Email</label>
        <input type="text" name="email" id="email" class="form-control" readonly><br />
        <label for="avatar" id="avatarLabel" hidden>Change profile image</label><br />
        <input type="file" name="avatar" id="avatar" class="form-control-file" hidden><br />
        <br />
        <button type="submit" id="submitForm" class="btn btn-success" hidden>Submit</button>
    </form>
    <br /><br />
    <button id="homeLink" type="button" class="btn btn-secondary">Home</button>
    <button id="editContact" type="button" class="btn btn-primary">Edit</button>
    <button id="deleteContact" type="button" class="btn btn-danger">Delete</button>

    <script src="config.js"></script>
    <script>
        var id = getID();
        document.getElementById("homeLink").addEventListener('click', homeLink);
        document.getElementById("editContact").addEventListener('click', editContact);
        document.getElementById("submitForm").addEventListener('click', submitForm);
        document.getElementById("deleteContact").addEventListener('click', deleteContact);

        function getID() {
            var url = window.location.href;
            var pos = url.search("=");
            var id = url.slice(pos + 1);
            return id;
        }
        function getContact() {
            fetch(rootPath + 'controller/get-contacts/?id=' + id)
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {
                    displayOutput(data);
                })
        }

        function homeLink() {
            window.open("index.html", "_self");
        }

        function displayOutput(data) {
            avatarImg = `
        <img src="${rootPath}/controller/uploads/${data[0].avatar}" width="200" class="rounded-circle img-thumbnail" />
    `;

            document.getElementById("avatarImage").innerHTML = avatarImg;
            document.getElementById("firstname").value = data[0].firstname;
            document.getElementById("lastname").value = data[0].lastname;
            document.getElementById("mobile").value = data[0].mobile;
            document.getElementById("email").value = data[0].email;
        }

        function editContact() {
            document.getElementById("firstname").readOnly = false;
            document.getElementById("lastname").readOnly = false;
            document.getElementById("mobile").readOnly = false;
            document.getElementById("email").readOnly = false;
            document.getElementById("avatar").hidden = false;
            document.getElementById("submitForm").hidden = false;
        }

        function submitForm(e) {
            e.preventDefault();

            const form = new FormData(document.querySelector("#editForm"));
            form.append('apiKey', apiKey);
            form.append('id', id);

            fetch(rootPath + 'controller/edit-contact/', {
                method: 'POST',
                headers: { 'Accept': 'application/json, *.*' },
                body: form
            })
                .then(function (response) {
                    return response.text();
                })
                .then(function (data) {
                    if (data == "1") {
                        alert("Contact edited.");
                        homeLink();
                    } else {
                        alert(data);
                        homeLink();
                    }
                })
        }

        function deleteContact() {
            var confirmDelete = confirm("Delete contact. Are you sure?");

            if (confirmDelete == true) {
                fetch(rootPath + 'controller/delete-contact/?id=' + id)
                    .then(function (response) {
                        return response.text();
                    })
                    .then(function (data) {
                        if (data == "1") {
                            homeLink();
                        } else {
                            alert(data);
                        }
                    })
            }
        }
    </script>
</body>

</html>
